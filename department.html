<!DOCTYPE html>
<html lang="en">
<head>
        <link rel="stylesheet" href="css/common.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments | ASM College</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        
#back-to-top {
    display: none;
    position: fixed;
    bottom: 25px;
    right: 25px;
    z-index: 1000;
    background: #0b3d91;
    color: white;
    border: none;
    border-radius: 50%;
    width: 48px;
    height: 48px;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

#back-to-top:hover {
    background: #082b66;
}

@media (max-width: 600px) {
    #back-to-top {
        bottom: 18px;
        right: 18px;
        width: 44px;
        height: 44px;
    }
}

/* Department Cards - Smooth 5 Degree Rotation */

.department-card {
    transition: transform 0.4s ease,
                box-shadow 0.4s ease;
    transform-origin: center;
}

.department-card:hover {
    transform: rotate(5deg);
    box-shadow: 0 10px 25px rgba(18, 60, 100, 0.18);
}

/* Keep animation smooth on smaller screens */
@media (prefers-reduced-motion: reduce) {
    .department-card {
        transition: none;
    }

    .department-card:hover {
        transform: none;
    }
}

/* Modern Department Search Box */
#department-search {
    width: 100%;
    max-width: 600px;
    display: block;
    margin: 20px auto;
    padding: 15px 20px;

    background-color: #ffffff;
    color: #111827;

    border: 2px solid #dbe5ef;
    border-radius: 30px;

    font-size: 16px;
    outline: none;

    box-shadow: 0 4px 15px rgba(11, 61, 145, 0.08);

    transition: border-color 0.3s ease,
                box-shadow 0.3s ease,
                transform 0.3s ease;
}

/* Search Box Focus Effect */
#department-search:focus {
    border-color: #0b3d91;
    box-shadow: 0 0 0 4px rgba(11, 61, 145, 0.12);
    transform: translateY(-2px);
}

/* Placeholder Text */
#department-search::placeholder {
    color: #64748b;
    opacity: 1;
}

/* Mobile Responsive */
@media (max-width: 600px) {
    #department-search {
        max-width: 100%;
        font-size: 14px;
        padding: 12px 16px;
    }
}

/* Our Departments Heading Animation */
.hero h1 {
    overflow: hidden;
    white-space: nowrap;
    width: 0;
    margin-inline: auto;
    animation: typingHeading 2s steps(16, end) forwards;
}

@keyframes typingHeading {
    from {
        width: 0;
    }
    to {
        width: 16ch;
    }
}


/* Light Blue Hero Section */
.hero {
    background: #EAF2FF !important;
    background-image: none !important;
    animation: none !important;
    color: #1E3A8A;
}

.hero h1,
.hero p {
    color: #1E3A8A;
}

/* Light Blue Departments Section */
.departments-section {
    background-color: #EAF2FF !important;
    background-image: none !important;
}



@keyframes gradientMove {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

@media (prefers-reduced-motion: reduce) {
    .hero {
        animation: none;
        background-position: center;
    }
}


/* Clean Department Cards */
.department-card {
    background-color: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
}
/* Navbar Height and Font Size */
.navbar {
    padding: 8px 15px;
    gap: 6px;
}

.logo {
    font-size: 24px;
}

.navbar nav {
    gap: 15px;
}

.navbar nav a {
    font-size: 13px;
    padding: 2px 0;
}

/* Mobile View */
@media (max-width: 600px) {
    .navbar {
        padding: 8px 10px;
        gap: 6px;
    }

    .logo {
        font-size: 21px;
    }

    .navbar nav {
        gap: 8px 12px;
    }

    .navbar nav a {
        font-size: 12px;
    }
}

    </style>
</head>

<body> 

   
<header class="navbar">
    <div class="logo">ASM College</div>
    <nav class="main-nav">
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="campus.html">Campus</a>
            <a href="coursesprog.html">Courses & Programs</a>
            <a href="contact.html">Contact Us</a>
            <a href="placement.html">Placements</a>
            <a href="department.html">Department</a>
            <a href="placement.html">Placements</a>
            <a href="addmission.html">Admission</a>
        </nav>
</header>

<section class="hero">
    <h1>Our Departments</h1>
    <p>Explore our departments and discover opportunities for academic and professional growth.</p>
</section>



    

    
<section class="departments-section">

    <div class="department-search">
        <input
            type="text"
            id="department-search"
            placeholder="Search departments..."
            aria-label="Search departments"
        >
        <p id="search-message" aria-live="polite"></p>
    </div>

    <div class="department-container" id="department-container">
        <!-- Department cards will load from JSON -->
    </div>

</section>

<button
    type="button"
    id="back-to-top"
    aria-label="Back to top"
    title="Back to top">
    ↑
</button>

<footer>
    <p>2026 ASM College.</p>
</footer>

<script src="js/asm.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const container = document.querySelector("#department-container");
    const searchInput = document.querySelector("#department-search");
    const message = document.querySelector("#search-message");
    const backToTopButton = document.querySelector("#back-to-top");

    try {
        const response = await fetch("data/departments.json");

        if (!response.ok) {
            throw new Error("Unable to load departments.json");
        }

        const data = await response.json();

        data.departments.forEach((department) => {
            const card = document.createElement("div");
            card.className = "department-card";

            const code = document.createElement("span");
            code.className = "department-code";
            code.textContent = department.code;

            const heading = document.createElement("h3");
            heading.textContent = department.name;

            const description = document.createElement("p");
            description.textContent = department.description;

            card.append(code, heading, description);

            if (department.code === "MCA") {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "view-details-btn";
                button.textContent = "View Details";
                button.setAttribute("aria-expanded", "false");

                const details = document.createElement("div");
                details.className = "course-details";
                details.hidden = true;

                const aboutHeading = document.createElement("h3");
                aboutHeading.textContent = "About MCA";

                const about = document.createElement("p");
                about.textContent = department.about;

                details.append(aboutHeading, about);

                function addList(title, items) {
                    const heading = document.createElement("h3");
                    heading.textContent = title;

                    const list = document.createElement("ul");

                    items.forEach((item) => {
                        const li = document.createElement("li");
                        li.textContent = item;
                        list.appendChild(li);
                    });

                    details.append(heading, list);
                }

                addList("Subjects and Skills", department.subjects);
                addList("Career Opportunities", department.careers);

                const duration = document.createElement("p");
                duration.textContent =
                    "Course Duration: " + department.duration;
                details.appendChild(duration);

                button.addEventListener("click", () => {
                    details.hidden = !details.hidden;
                    button.textContent = details.hidden
                        ? "View Details"
                        : "Hide Details";
                    button.setAttribute(
                        "aria-expanded",
                        String(!details.hidden)
                    );
                });

                card.append(button, details);
            }

            container.appendChild(card);
        });

        // Department Search
        if (searchInput && message) {
            try {
                searchInput.value =
                    localStorage.getItem("asmDepartmentSearch") || "";
            } catch (error) {}

            function updateSearch() {
                const query = searchInput.value.toLowerCase().trim();
                let count = 0;

                container.querySelectorAll(".department-card").forEach((card) => {
                    const matches = card.textContent
                        .toLowerCase()
                        .includes(query);

                    card.hidden = !matches;
                    if (matches) count++;
                });

                message.textContent = count === 0
                    ? "No departments found."
                    : `${count} department(s) found.`;
            }

            searchInput.addEventListener("input", () => {
                updateSearch();

                try {
                    localStorage.setItem(
                        "asmDepartmentSearch",
                        searchInput.value
                    );
                } catch (error) {}
            });

            updateSearch();
        }
    } catch (error) {
        console.error("Department loading error:", error);
        container.textContent = "Unable to load departments.";
    }

    // Back to Top
    if (backToTopButton) {
        window.addEventListener("scroll", () => {
            backToTopButton.style.display =
                window.scrollY > 200 ? "block" : "none";
        });

        backToTopButton.addEventListener("click", () => {
            window.scrollTo({ top: 0, behavior: "smooth" });
        });
    }
});
</script>

</body>
</html>
