<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments | ASM College</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        .navbar {
            background: #0b3d91;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 18px;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
        }

        .navbar nav {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 25px;
        }

        .navbar nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            white-space: nowrap;
        }

        .navbar nav a:hover {
            text-decoration: underline;
            color: #dbeafe;
        }

        @media (max-width: 600px) {
            .logo {
                font-size: 27px;
            }

            .navbar nav {
                gap: 14px;
            }

            .navbar nav a {
                font-size: 14px;
            }
        }
        
#back-to-top {
    display: none;
    position: fixed;
    bottom: 25px;
    right: 25px;
    z-index: 1000;
    background: #0b3d91;
    color: white;
    border: none;
    border-radius: 50%;
    width: 48px;
    height: 48px;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

#back-to-top:hover {
    background: #082b66;
}

@media (max-width: 600px) {
    #back-to-top {
        bottom: 18px;
        right: 18px;
        width: 44px;
        height: 44px;
    }
}

    </style>
</head>

<body> 

   
<header class="navbar">
    <div class="logo">ASM College</div>
    <nav class="main-nav">
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="campus.html">Campus</a>
            <a href="coursesprog.html">Courses & Programs</a>
            <a href="contacts.html">Contact Us</a>
            <a href="placements.html">Placements</a>
            <a href="department.html">Department</a>
            <a href="Faculty.html" class="active">Faculty</a>
        </nav>
</header>

<section class="hero">
    <h1>Our Departments</h1>
    <p>Explore our departments and discover opportunities for academic and professional growth.</p>
</section>

<section class="departments-section">
    <h2>Academic Departments</h2>
    <div class="underline"></div>

    
<div class="department-search">
    <input
        type="text"
        id="department-search"
        placeholder="Search departments..."
        aria-label="Search departments"
    >
    <p id="search-message" aria-live="polite"></p>
    
<section class="departments-section">
    <h2>Academic Departments</h2>
    <div class="underline"></div>

    <div class="department-search">
        <input
            type="text"
            id="department-search"
            placeholder="Search departments..."
            aria-label="Search departments"
        >
        <p id="search-message" aria-live="polite"></p>
    </div>

    <div class="department-container" id="department-container">
        <!-- Department cards will load from JSON -->
    </div>
</section>

   
</section>

<button
    type="button"
    id="back-to-top"
    aria-label="Back to top"
    title="Back to top">
    ↑
</button>

<footer>
    <p>2026 ASM College.</p>
</footer>

<script src="js/asm.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const container = document.querySelector("#department-container");
    const searchInput = document.querySelector("#department-search");
    const message = document.querySelector("#search-message");
    const backToTopButton = document.querySelector("#back-to-top");

    try {
        const response = await fetch("data/departments.json");

        if (!response.ok) {
            throw new Error("Unable to load departments.json");
        }

        const data = await response.json();

        data.departments.forEach((department) => {
            const card = document.createElement("div");
            card.className = "department-card";

            const code = document.createElement("span");
            code.className = "department-code";
            code.textContent = department.code;

            const heading = document.createElement("h3");
            heading.textContent = department.name;

            const description = document.createElement("p");
            description.textContent = department.description;

            card.append(code, heading, description);

            if (department.code === "MCA") {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "view-details-btn";
                button.textContent = "View Details";
                button.setAttribute("aria-expanded", "false");

                const details = document.createElement("div");
                details.className = "course-details";
                details.hidden = true;

                const aboutHeading = document.createElement("h3");
                aboutHeading.textContent = "About MCA";

                const about = document.createElement("p");
                about.textContent = department.about;

                details.append(aboutHeading, about);

                function addList(title, items) {
                    const heading = document.createElement("h3");
                    heading.textContent = title;

                    const list = document.createElement("ul");

                    items.forEach((item) => {
                        const li = document.createElement("li");
                        li.textContent = item;
                        list.appendChild(li);
                    });

                    details.append(heading, list);
                }

                addList("Subjects and Skills", department.subjects);
                addList("Career Opportunities", department.careers);

                const duration = document.createElement("p");
                duration.textContent =
                    "Course Duration: " + department.duration;
                details.appendChild(duration);

                button.addEventListener("click", () => {
                    details.hidden = !details.hidden;
                    button.textContent = details.hidden
                        ? "View Details"
                        : "Hide Details";
                    button.setAttribute(
                        "aria-expanded",
                        String(!details.hidden)
                    );
                });

                card.append(button, details);
            }

            container.appendChild(card);
        });

        // Department Search
        if (searchInput && message) {
            try {
                searchInput.value =
                    localStorage.getItem("asmDepartmentSearch") || "";
            } catch (error) {}

            function updateSearch() {
                const query = searchInput.value.toLowerCase().trim();
                let count = 0;

                container.querySelectorAll(".department-card").forEach((card) => {
                    const matches = card.textContent
                        .toLowerCase()
                        .includes(query);

                    card.hidden = !matches;
                    if (matches) count++;
                });

                message.textContent = count === 0
                    ? "No departments found."
                    : `${count} department(s) found.`;
            }

            searchInput.addEventListener("input", () => {
                updateSearch();

                try {
                    localStorage.setItem(
                        "asmDepartmentSearch",
                        searchInput.value
                    );
                } catch (error) {}
            });

            updateSearch();
        }
    } catch (error) {
        console.error("Department loading error:", error);
        container.textContent = "Unable to load departments.";
    }

    // Back to Top
    if (backToTopButton) {
        window.addEventListener("scroll", () => {
            backToTopButton.style.display =
                window.scrollY > 200 ? "block" : "none";
        });

        backToTopButton.addEventListener("click", () => {
            window.scrollTo({ top: 0, behavior: "smooth" });
        });
    }
});
</script>

</body>
</html>
